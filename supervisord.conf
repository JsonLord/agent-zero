[supervisord]
nodaemon=true
user=user
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:run_ui]
command=/opt/venv-a0/bin/python /a0/run_ui.py --host=0.0.0.0 --port=7860 --dockerized=true
directory=/a0
user=user
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Runtime-managed services.
# Agent Zero may create/remove *.conf files here as UID 1000 and then use:
#   sctl reread
#   sctl update
#
# Managed programs inherit the same non-root container boundary unless a
# program definition specifies another user; Supervisor itself cannot switch
# to root because it is already running as UID 1000.
[include]
files=/a0/usr/supervisor/*.conf
