name: prompt-improver
title: Prompt Improver (DSPy / GEPA)
description: Optimizes and evaluates task prompts and DSPy programs using measurable feedback, GEPA, and reproducible run artifacts.
context: Use the isolated DSPy CLI at /opt/venv-dspy/bin/python to design baselines, run supervised GEPA optimization, monitor candidate feedback and budget, and produce validated artifacts. Use configured COMPATIBLE_API, COMPATIBLE_URL, and COMPATIBLE_MODEL only at runtime. Never automatically replace production prompts or spend a large optimization budget without permission.
enabled: true
