name: Deploy Main Snapshot To Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: huggingface-space-leon4gr45-agent
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          # The Space receives a clean deployment snapshot, not GitHub history.
          # Historical blobs in this repository exceed Hugging Face's limits.
          fetch-depth: 1

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::Add a write-scoped HF_TOKEN repository secret."
            exit 1
          fi

      - name: Create clean Space snapshot
        run: |
          snapshot="$RUNNER_TEMP/huggingface-space"
          mkdir -p "$snapshot"
          git archive --format=tar HEAD | tar -xf - -C "$snapshot"

          # Hugging Face reads Space configuration from README frontmatter. Add
          # it only to the deployment snapshot so upstream README updates do
          # not conflict with this deployment branch.
          python3 - "$snapshot/README.md" <<'PY'
          from pathlib import Path
          import sys

          readme = Path(sys.argv[1])
          content = readme.read_text(encoding="utf-8")
          metadata = """---
          title: Agent Zero
          emoji: 🤖
          colorFrom: indigo
          colorTo: blue
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          """
          readme.write_text(metadata + content, encoding="utf-8")
          PY

      - name: Install Hugging Face Xet client
        run: python3 -m pip install --disable-pip-version-check "huggingface_hub[hf_xet]>=0.32,<2"

      - name: Upload snapshot to the Docker Space with Xet
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          snapshot="$RUNNER_TEMP/huggingface-space"
          python3 - "$snapshot" <<'PY'
          from pathlib import Path
          import os
          import sys

          from huggingface_hub import HfApi

          snapshot = Path(sys.argv[1])
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path=snapshot,
              repo_id="Leon4gr45/agent",
              repo_type="space",
              commit_message=f"Deploy GitHub main at {os.environ['SOURCE_SHA']}",
          )
          PY
